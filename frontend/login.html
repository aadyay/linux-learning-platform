<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | LinuxLearn</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">LinuxLearn.</a>
        <a href="signup.html" class="btn btn-secondary">Sign up</a>
    </nav>

    <main class="form-container">

        <div class="form-card">

            <h1 class="form-title">Welcome back.</h1>

            <p class="form-subtitle">
                Log in to continue your Linux learning journey.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Log in
                </button>

                <p id="loginMessage"></p>

            </form>

            <div class="form-footer">
                Don't have an account?
                <a href="signup.html">Create account</a>
            </div>

        </div>

    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const message = document.getElementById("loginMessage");

            try {

                const result = await api.login({
                    email,
                    password
                });

                saveLogin(result.token, result.name);

                window.location.href = "dashboard.html";

            } catch (error) {

                message.className = "message message-error";
                message.textContent = error.message;

            }

        });

    </script>

</body>
</html>
